<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetScanner</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080d14;
    --panel: #0d1520;
    --panel2: #111c2d;
    --border: #1a3050;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff6b35;
    --text: #c8dff0;
    --text-dim: #4a7090;
    --online: #00ff9d;
    --offline: #ff4444;
    --font-mono: 'Share Tech Mono', monospace;
    --font-main: 'Exo 2', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grille de fond animée */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 48px; height: 48px;
    position: relative;
  }
  .logo svg { width: 100%; height: 100%; }
  .header-text h1 {
    font-family: var(--font-mono);
    font-size: 26px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .header-text p { color: var(--text-dim); font-size: 13px; letter-spacing: 1px; }
  .status-badge {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s;
  }
  .status-dot.online { background: var(--online); box-shadow: 0 0 8px var(--online); animation: pulse 2s infinite; }
  .status-dot.offline { background: var(--offline); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* PANNEAU CONFIG */
  .config-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 16px;
    align-items: end;
  }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }
  .field select option { background: var(--panel2); }

  .options-row {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    align-items: center;
  }
  .toggle-label {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; font-size: 13px; color: var(--text-dim);
    user-select: none;
  }
  .toggle {
    width: 38px; height: 20px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    transition: background 0.2s;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: left 0.2s, background 0.2s;
  }
  input[type=checkbox]:checked + .toggle { background: rgba(0,212,255,0.2); border-color: var(--accent); }
  input[type=checkbox]:checked + .toggle::after { left: 20px; background: var(--accent); }
  input[type=checkbox] { display: none; }

  .btn-scan {
    background: linear-gradient(135deg, var(--accent), #0090bb);
    border: none;
    border-radius: 8px;
    padding: 11px 28px;
    color: #000;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
    white-space: nowrap;
  }
  .btn-scan:hover { box-shadow: 0 0 20px rgba(0,212,255,0.4); transform: translateY(-1px); }
  .btn-scan:active { transform: translateY(0); }
  .btn-scan:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .btn-stop {
    background: linear-gradient(135deg, var(--warn), #c04010);
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: none;
  }

  /* STATS */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    text-align: center;
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 28px;
    color: var(--accent);
    line-height: 1;
  }
  .stat-value.green { color: var(--accent2); }
  .stat-label { font-size: 11px; letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }

  /* PROGRESS */
  .progress-wrap {
    margin-bottom: 20px;
    display: none;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-dim);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 4px;
    background: var(--panel2);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s;
  }

  /* TOOLBAR résultats */
  .results-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .results-title {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .filter-input {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
    width: 200px;
  }
  .filter-input:focus { border-color: var(--accent); }
  .btn-export {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--accent2);
    border-radius: 6px;
    padding: 6px 16px;
    color: var(--accent2);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.2s;
  }
  .btn-export:hover { background: rgba(0,255,157,0.1); }

  /* TABLE */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .hosts-table {
    width: 100%;
    border-collapse: collapse;
  }
  .hosts-table th {
    background: var(--panel2);
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .hosts-table td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(26,48,80,0.5);
    font-size: 13px;
    vertical-align: middle;
  }
  .hosts-table tr:last-child td { border-bottom: none; }
  .hosts-table tr { transition: background 0.15s; cursor: pointer; }
  .hosts-table tr:hover td { background: rgba(0,212,255,0.04); }

  .host-row { animation: rowIn 0.3s ease both; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .ip-cell { font-family: var(--font-mono); color: var(--accent); font-size: 14px; }
  .mac-cell { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .hostname-cell { font-size: 13px; }
  .ports-cell { display: flex; flex-wrap: wrap; gap: 4px; }
  .port-badge {
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    white-space: nowrap;
  }
  .port-badge.rdp { border-color: rgba(255,107,53,0.5); color: var(--warn); background: rgba(255,107,53,0.1); }
  .port-badge.web { border-color: rgba(0,255,157,0.3); color: var(--accent2); background: rgba(0,255,157,0.1); }

  .status-online {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--online); font-size: 12px;
  }
  .status-online::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--online);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--online);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 16px; opacity: .3; }
  .empty-state p { font-size: 14px; }

  .log-panel {
    margin-top: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .log-header {
    background: var(--panel2);
    padding: 10px 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  .log-body {
    padding: 12px 16px;
    max-height: 120px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.8;
  }
  .log-line { color: var(--text-dim); }
  .log-line.info { color: var(--accent); }
  .log-line.success { color: var(--accent2); }
  .log-line.warn { color: var(--warn); }

  @media (max-width: 768px) {
    .config-grid { grid-template-columns: 1fr 1fr; }
    .stats-bar { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="20" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.4"/>
        <circle cx="24" cy="24" r="13" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
        <circle cx="24" cy="24" r="4" fill="#00d4ff"/>
        <line x1="24" y1="4" x2="24" y2="44" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
        <line x1="4" y1="24" x2="44" y2="24" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
        <circle cx="24" cy="11" r="2" fill="#00ff9d" opacity="0.8"/>
        <circle cx="37" cy="24" r="2" fill="#00d4ff" opacity="0.6"/>
        <circle cx="14" cy="32" r="2" fill="#00ff9d" opacity="0.8"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>NetScanner</h1>
      <p>NETWORK DISCOVERY TOOL v2.0</p>
    </div>
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Vérification...</span>
    </div>
  </header>

  <!-- CONFIGURATION -->
  <div class="config-panel">
    <div class="config-grid">
      <div class="field">
        <label>Plage IP</label>
        <input type="text" id="ipRange" value="192.168.1.1-254" placeholder="ex: 192.168.1.1-254">
      </div>
      <div class="field">
        <label>Timeout (s)</label>
        <input type="number" id="timeout" value="1" min="0.2" max="5" step="0.1">
      </div>
      <div class="field">
        <label>Threads</label>
        <select id="threads">
          <option value="20">20 — Léger</option>
          <option value="50" selected>50 — Normal</option>
          <option value="100">100 — Rapide</option>
          <option value="200">200 — Agressif</option>
        </select>
      </div>
      <div>
        <button class="btn-scan" id="btnScan" onclick="startScan()">▶ SCANNER</button>
        <button class="btn-stop" id="btnStop" onclick="stopScan()">■ STOP</button>
      </div>
    </div>
    <div class="options-row">
      <label class="toggle-label">
        <input type="checkbox" id="doPorts">
        <span class="toggle"></span>
        Scanner les ports TCP
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="streamMode" checked>
        <span class="toggle"></span>
        Mode temps réel (SSE)
      </label>
      <span style="margin-left:auto; font-size:12px; color:var(--text-dim)">
        Backend : <input id="backendUrl" value="http://localhost:5000" style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:12px;outline:none;width:160px;padding:2px 4px;">
      </span>
      <button onclick="autoDetectIP()" style="background:transparent;border:1px solid var(--border);border-radius:4px;padding:4px 10px;color:var(--text-dim);font-size:11px;cursor:pointer;font-family:var(--font-mono);">AUTO-DETECT</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-value" id="statScanned">0</div>
      <div class="stat-label">IPs scannées</div>
    </div>
    <div class="stat-card">
      <div class="stat-value green" id="statFound">0</div>
      <div class="stat-label">Hôtes trouvés</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statPorts">0</div>
      <div class="stat-label">Ports ouverts</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statTime">0s</div>
      <div class="stat-label">Durée</div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-info">
      <span id="progressLabel">Scan en cours...</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- TOOLBAR -->
  <div class="results-toolbar">
    <span class="results-title">Résultats</span>
    <input class="filter-input" id="filterInput" placeholder="Filtrer IP / hostname..." oninput="filterHosts()">
    <button class="btn-export" onclick="exportJSON()">⬇ EXPORT JSON</button>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table class="hosts-table">
      <thead>
        <tr>
          <th>Adresse IP</th>
          <th>MAC</th>
          <th>Hostname</th>
          <th>Ports ouverts</th>
          <th>Statut</th>
          <th>Heure</th>
        </tr>
      </thead>
      <tbody id="hostsBody">
        <tr id="emptyRow">
          <td colspan="6">
            <div class="empty-state">
              <div class="big-icon">⬡</div>
              <p>Lance un scan pour découvrir les hôtes du réseau</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- LOG -->
  <div class="log-panel">
    <div class="log-header">Journal</div>
    <div class="log-body" id="logBody"></div>
  </div>

</div>

<script>
let hosts = [];
let scanStartTime = null;
let timerInterval = null;
let currentSSE = null;
let isStopped = false;

const $ = id => document.getElementById(id);

// --- INIT ---
window.onload = () => {
  checkBackend();
};

async function checkBackend() {
  const url = $('backendUrl').value;
  try {
    const r = await fetch(`${url}/api/status`, { signal: AbortSignal.timeout(3000) });
    const d = await r.json();
    if (d.status === 'running') {
      $('statusDot').className = 'status-dot online';
      $('statusText').textContent = 'Backend connecté';
      log(`Backend actif — Plateforme: ${d.platform}`, 'info');
    }
  } catch {
    $('statusDot').className = 'status-dot offline';
    $('statusText').textContent = 'Backend hors ligne';
    log('Backend non accessible. Lance start.bat', 'warn');
  }
}

async function autoDetectIP() {
  const url = $('backendUrl').value;
  try {
    const r = await fetch(`${url}/api/local-ip`);
    const d = await r.json();
    $('ipRange').value = d.suggested_range;
    log(`IP locale: ${d.local_ip} → Plage: ${d.suggested_range}`, 'success');
  } catch {
    log('Impossible de détecter l\'IP locale', 'warn');
  }
}

// --- SCAN ---
async function startScan() {
  if (!await verifyBackend()) return;

  hosts = [];
  isStopped = false;
  $('hostsBody').innerHTML = '';
  $('statScanned').textContent = '0';
  $('statFound').textContent = '0';
  $('statPorts').textContent = '0';
  $('statTime').textContent = '0s';
  $('btnScan').disabled = true;
  $('btnStop').style.display = 'inline-block';
  $('progressWrap').style.display = 'block';

  scanStartTime = Date.now();
  timerInterval = setInterval(() => {
    $('statTime').textContent = ((Date.now() - scanStartTime) / 1000).toFixed(1) + 's';
  }, 200);

  const params = {
    range: $('ipRange').value,
    timeout: parseFloat($('timeout').value),
    threads: parseInt($('threads').value),
    ports: $('doPorts').checked
  };

  log(`Scan démarré : ${params.range} | Threads: ${params.threads} | Ports: ${params.ports}`, 'info');

  if ($('streamMode').checked) {
    await scanSSE(params);
  } else {
    await scanSimple(params);
  }
}

async function scanSSE(params) {
  const url = $('backendUrl').value;
  try {
    const resp = await fetch(`${url}/api/scan/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      if (isStopped) break;
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try { handleSSEEvent(JSON.parse(line.slice(6))); } catch {}
        }
      }
    }
  } catch(e) {
    log(`Erreur SSE: ${e.message}`, 'warn');
  } finally {
    endScan();
  }
}

function handleSSEEvent(ev) {
  if (ev.type === 'start') {
    updateProgress(0, ev.total, 0);
    log(`Total IPs à scanner: ${ev.total}`, 'info');
  } else if (ev.type === 'host') {
    addHost(ev.host);
    updateProgress(ev.scanned, ev.total, ev.found);
  } else if (ev.type === 'progress') {
    updateProgress(ev.scanned, ev.total, ev.found);
  } else if (ev.type === 'done') {
    log(`Scan terminé — ${ev.found} hôtes trouvés sur ${ev.scanned} IPs`, 'success');
  }
}

async function scanSimple(params) {
  const url = $('backendUrl').value;
  try {
    updateProgress(0, 100, 0);
    $('progressLabel').textContent = 'Scan en cours (mode simple)...';
    const r = await fetch(`${url}/api/scan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    const d = await r.json();
    if (d.error) { log(d.error, 'warn'); return; }
    d.hosts.forEach(h => addHost(h));
    updateProgress(d.scanned, d.scanned, d.total);
    log(`Scan terminé — ${d.total} hôtes trouvés sur ${d.scanned} IPs`, 'success');
  } catch(e) {
    log(`Erreur: ${e.message}`, 'warn');
  } finally {
    endScan();
  }
}

function stopScan() {
  isStopped = true;
  log('Scan interrompu par l\'utilisateur', 'warn');
  endScan();
}

function endScan() {
  clearInterval(timerInterval);
  $('btnScan').disabled = false;
  $('btnStop').style.display = 'none';
  if (hosts.length === 0) {
    $('hostsBody').innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="big-icon">⬡</div><p>Aucun hôte trouvé</p></div></td></tr>`;
  }
}

// --- AFFICHAGE ---
function addHost(h) {
  hosts.push(h);

  // Stats
  $('statFound').textContent = hosts.length;
  const totalPorts = hosts.reduce((s, x) => s + (x.ports?.length || 0), 0);
  $('statPorts').textContent = totalPorts;

  // Ligne
  const emptyRow = $('emptyRow');
  if (emptyRow) emptyRow.remove();

  const tr = document.createElement('tr');
  tr.className = 'host-row';
  tr.dataset.ip = h.ip;
  tr.dataset.hostname = h.hostname || '';

  const portsHtml = (h.ports || []).map(p => {
    let cls = 'port-badge';
    if ([80,443,8080,8443].includes(p.port)) cls += ' web';
    if (p.port === 3389) cls += ' rdp';
    return `<span class="${cls}">${p.port}/${p.service}</span>`;
  }).join('');

  tr.innerHTML = `
    <td class="ip-cell">${h.ip}</td>
    <td class="mac-cell">${h.mac || 'N/A'}</td>
    <td class="hostname-cell">${h.hostname || '<span style="color:var(--text-dim)">—</span>'}</td>
    <td class="ports-cell">${portsHtml || '<span style="color:var(--text-dim);font-size:12px">—</span>'}</td>
    <td><span class="status-online">EN LIGNE</span></td>
    <td style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim)">${h.scan_time}</td>
  `;
  $('hostsBody').appendChild(tr);
}

function updateProgress(scanned, total, found) {
  const pct = total > 0 ? Math.round((scanned / total) * 100) : 0;
  $('progressFill').style.width = pct + '%';
  $('progressPct').textContent = pct + '%';
  $('progressLabel').textContent = `Scan : ${scanned}/${total} IPs — ${found} hôtes`;
  $('statScanned').textContent = scanned;
}

function filterHosts() {
  const q = $('filterInput').value.toLowerCase();
  document.querySelectorAll('.host-row').forEach(tr => {
    const ip = tr.dataset.ip.toLowerCase();
    const hn = tr.dataset.hostname.toLowerCase();
    tr.style.display = (!q || ip.includes(q) || hn.includes(q)) ? '' : 'none';
  });
}

function exportJSON() {
  const blob = new Blob([JSON.stringify({ hosts, exported: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `netscanner_${Date.now()}.json`;
  a.click();
}

async function verifyBackend() {
  const url = $('backendUrl').value;
  try {
    await fetch(`${url}/api/status`, { signal: AbortSignal.timeout(2000) });
    return true;
  } catch {
    log('Backend non accessible ! Lance start.bat', 'warn');
    $('statusDot').className = 'status-dot offline';
    $('statusText').textContent = 'Backend hors ligne';
    return false;
  }
}

function log(msg, type = '') {
  const el = document.createElement('div');
  el.className = `log-line ${type}`;
  el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  const body = $('logBody');
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
}
</script>
</body>
</html>
